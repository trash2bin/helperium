global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'data-service'
    metrics_path: '/metrics'
    params:
      tenant: ['default']
    static_configs:
      - targets: ['data-service:8084']

  - job_name: 'mcp-gateway'
    static_configs:
      - targets: ['mcp-gateway:8083']

  # /metrics is deliberately bearer-protected (fail-closed). The token is
  # injected from the API_BEARER_TOKEN environment variable at startup via a
  # minimal entrypoint wrapper — no plaintext token is committed to the repo.
  # With OTEL/metrics auth disabled in dev this keeps parity with production.
  - job_name: 'api-service'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/api_bearer_token
    static_configs:
      - targets: ['api:8081']

  - job_name: 'admin-dashboard'
    static_configs:
      - targets: ['admin-dashboard:8085']

  - job_name: 'rag-service'
    static_configs:
      - targets: ['rag:8082']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
