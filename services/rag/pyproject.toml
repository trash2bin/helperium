[project]
name = "rag"
version = "1.1.0"
license = "MPL-2.0"
requires-python = ">=3.12, <3.14"
dependencies = [
    "helperium-sdk",
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.38.0",
    "starlette>=0.50.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "prometheus-client>=0.21.0",
    "sentence-transformers>=5.5.1",
    "chromadb>=1.5.9",
    "docling>=2.0.0",
    "chonkie[semantic]>=1.0.0",
    "cachetools>=5.5.0",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
]

[project.optional-dependencies]
cli = [
    "faker>=20.0.0",
    "python-docx>=1.2.0",
]
pg = [
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
agent-rag = "rag.service:main"
agent-rag-docgen = "rag.fixtures.cli_docgen:main"
agent-rag-ingest = "rag.fixtures.cli_ingest:main"
agent-seedgen = "rag.fixtures.seedgen:main"

[tool.uv]
index-strategy = "unsafe-first-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
# setuptools (а не hatchling) — ради `package-dir`-маппинга ниже: он позволяет
# объявить пакетом `rag` саму директорию сервиса, без переноса файлов в подпапку.
# Hatchling так не может: editable-установка с `sources`-перезаписью префикса
# (`sources` меняет префикс, а не убирает его) им прямо запрещена.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `services/rag/*` — это и есть пакет `rag` (плоский layout). Без маппинга
# установка выкладывает содержимое как верхнеуровневые модули (`config`,
# `service`, `fixtures`…), и `import rag` не работает ни в console script,
# ни в обычном `python -c`.
packages = [
    "rag",
    "rag.cache",
    "rag.chunker",
    "rag.embedding",
    "rag.fixtures",
    "rag.parser",
    "rag.pipeline",
    "rag.reranker",
    "rag.vector_store",
]

[tool.setuptools.package-dir]
rag = "."
