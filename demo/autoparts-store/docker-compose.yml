version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: autoparts-db
    environment:
      POSTGRES_DB: ${STORE_DB_NAME:-autoparts}
      POSTGRES_USER: ${STORE_DB_USER:-autoparts}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD:?set STORE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORE_DB_USER:-autoparts} -d ${STORE_DB_NAME:-autoparts}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storefront-init:
    build: .
    command: >
      sh -c "
        python manage.py makemigrations catalog &&
        python manage.py migrate &&
        python manage.py seed_data
      "
    environment:
      # Pentest 2026-09-13 (M2): no service — including one-shot init jobs —
      # runs with DJANGO_DEBUG=true; DEBUG pages dump settings and secrets.
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-autoparts-dev-secret-change-me}
      DB_HOST: db
      DB_NAME: ${STORE_DB_NAME:-autoparts}
      DB_USER: ${STORE_DB_USER:-autoparts}
      DB_PASSWORD: ${STORE_DB_PASSWORD:?set STORE_DB_PASSWORD in .env}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  helperium-readonly-bootstrap:
    build: .
    command: ["python", "helperium_readonly_bootstrap.py"]
    environment:
      STORE_DB_HOST: ${STORE_DB_HOST:-db}
      STORE_DB_PORT: ${STORE_DB_PORT:-5432}
      STORE_DB_NAME: ${STORE_DB_NAME:-autoparts}
      STORE_DB_USER: ${STORE_DB_USER:-autoparts}
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD:?set STORE_DB_PASSWORD in .env}
      HELPERIUM_AUTOPARTS_RO_USER: ${HELPERIUM_AUTOPARTS_RO_USER:-helperium_autoparts_ro}
      HELPERIUM_AUTOPARTS_RO_PASSWORD: ${HELPERIUM_AUTOPARTS_RO_PASSWORD:?set HELPERIUM_AUTOPARTS_RO_PASSWORD}
      HELPERIUM_AUTOPARTS_DSN_HOST: ${HELPERIUM_AUTOPARTS_DSN_HOST:-}
      HELPERIUM_AUTOPARTS_DSN_PORT: ${HELPERIUM_AUTOPARTS_DSN_PORT:-0}
      HELPERIUM_AUTOPARTS_REGISTER_TENANT: ${HELPERIUM_AUTOPARTS_REGISTER_TENANT:-false}
      HELPERIUM_DATA_SERVICE_URL: ${HELPERIUM_DATA_SERVICE_URL:-}
      HELPERIUM_DATA_ADMIN_TOKEN: ${HELPERIUM_DATA_ADMIN_TOKEN:-}
      HELPERIUM_AUTOPARTS_TENANT_ID: ${HELPERIUM_AUTOPARTS_TENANT_ID:-autoparts}
    depends_on:
      storefront-init:
        condition: service_completed_successfully

  web:
    build: .
    container_name: autoparts-web
    # Pentest 2026-09-13 (M2): serve with the production-grade stack
    # (gunicorn via the image CMD pattern), never the Django dev server.
    # collectstatic runs at start because the `.:/app` bind mount shadows the
    # staticfiles baked into the image and whitenoise's manifest storage
    # requires them when DJANGO_DEBUG=false.
    command: >
      sh -c "
        python manage.py createcachetable &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
          --workers 3 --threads 2 --timeout 60
          --access-logfile - --error-logfile -
      "
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      # Local dev secret; override DJANGO_SECRET_KEY in the environment for
      # anything reachable beyond loopback (see docker-compose.public.yml).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-autoparts-dev-secret-change-me}
      # Loopback-only plain HTTP demo: Secure-cookie defaults would break
      # CSRF/session flows in browsers that refuse Secure cookies over http.
      DJANGO_SECURE_COOKIES: "false"
      DB_HOST: db
      DB_NAME: ${STORE_DB_NAME:-autoparts}
      DB_USER: ${STORE_DB_USER:-autoparts}
      DB_PASSWORD: ${STORE_DB_PASSWORD:?set STORE_DB_PASSWORD in .env}
      # The local storefront is a separate browser origin from Helperium.
      # Keep the integration HTML-only: the browser loads the widget bundle
      # and calls the host-published API directly; never render a Docker DNS
      # name into browser HTML.
      HELPERIUM_WIDGET_ENABLED: ${HELPERIUM_WIDGET_ENABLED:-true}
      HELPERIUM_API_BASE: ${HELPERIUM_API_BASE:-http://127.0.0.1:8081}
      HELPERIUM_AGENT: ${HELPERIUM_AGENT:-autoparts-assistant}
      HELPERIUM_WIDGET_TITLE: ${HELPERIUM_WIDGET_TITLE:-Помощник по подбору}
    volumes:
      - .:/app
    depends_on:
      helperium-readonly-bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
