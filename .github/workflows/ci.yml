name: CI
"on":
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-python:
    name: Python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install uv + deps
        run: |
          pip install uv
          uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check services/api-service/src/
      - name: Ruff format check
        run: uv run ruff format --check services/api-service/src/
      - name: Pyright type check
        run: |
          npm install -g pyright
          pyright
      - name: uv audit — dependency vulnerability scan
        # Warn, don't fail: 3 vulns are unfixable (chromadb code injection, torch
        # memory corruption — no upstream patch available). All fixable vulns
        # have been upgraded. Check `make ci-audit` locally for details.
        run: uv audit --preview-features audit-command || true

  docs-links:
    name: Docs — мёртвые пути
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs paths (AGENTS.md, doc/, services/*/README, specs/, demo/)
        run: python3 infra/scripts/check_docs_paths.py

  lint-js:
    name: JS lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Biome lint
        run: npx @biomejs/biome check --max-diagnostics=500

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install uv + deps
        run: |
          pip install uv
          uv sync --frozen
      - name: Run API tests
        run: uv run pytest services/api-service/src/api_service/tests/ -v --tb=short
        env:
          OLLAMA_URL: "http://localhost:11434"
          OLLAMA_MODEL: "qwen2.5:0.5b"
          PYTHONPATH: ${{ github.workspace }}
      - name: Run demo web tests
        run: uv run pytest demo/web/tests/ demo/tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run SDK tests
        run: uv run pytest services/helperium-sdk/tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run RAG unit tests
        run: uv run pytest services/rag/tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run RAG search quality benchmark (CI mode — mock embeddings)
        run: uv run pytest services/rag/tests/benchmark/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [services/data-service, services/mcp-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: govulncheck — Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: ${{ matrix.dir }}
      - name: golangci-lint (install v2 from source)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        working-directory: ${{ matrix.dir }}
      - name: Run golangci-lint
        run: golangci-lint run ./...
        working-directory: ${{ matrix.dir }}

  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [services/data-service, services/mcp-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Test
        # NOTE: grep removed from pipeline — go test -json exits 0 on success and
        #       1 on failure, which is the correct signal. The old | grep -E ...
        #       caused a false-positive CI failure when all tests passed (grep
        #       exits 1 on no match, and GHA's pipefail propagates that).
        #       Full JSON log saved via tee for inspection.
        run: go test ./... -count=1 -timeout 180s -json 2>&1 | tee /tmp/gotest-json.log
        working-directory: ${{ matrix.dir }}

  test-e2e:
    name: E2E tests (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Docker layer cache (type=gha) ──────────────────────────────
      # Общий слой кэшируется в GH Actions cache между runs → повторные
      # сборки образов занимают минуты вместо десятков.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build data-service (cache Docker layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/data-service/Dockerfile
          tags: helperium-data:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mcp-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mcp-gateway/Dockerfile
          tags: helperium-mcp-gateway:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api-service/Dockerfile
          tags: helperium-api:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/admin-dashboard/Dockerfile
          tags: helperium-admin:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/web/Dockerfile
          tags: helperium-web:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare .data directories and workspace
        run: |
          mkdir -p infra/.data/app infra/.data/rag infra/.data/hf_cache infra/.data/uploads infra/.data/pg infra/.data/tenants
          mkdir -p backlog
          # All containers run as UID 1000 via docker-compose.ci.yml
          sudo chown -R 1000:1000 infra/.data backlog
          # e2e container (UID 1000) needs write access to workspace root
          # for demo_sessions.sqlite and test DB creation
          sudo chmod 777 .
          # Generate shop data.db (gitignored, needed by mcp_composite/mcp_dynamic tests)
          SHOP_DB=services/data-service/testdata/scenarios/shop/data.db python3 services/data-service/testdata/scripts/create_shop_db.py
          # data-service needs write access for WAL mode (UID 1000 vs runner UID 1001)
          sudo chmod -R 777 services/data-service/testdata/scenarios
      - name: Start isolated E2E dependencies (container, profile=test)
        run: |
          # ci-state-init intentionally exits 0 after preparing named volumes.
          # Do not attach it to --abort-on-container-exit: that would stop the
          # stack before the e2e pytest container starts.
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.ci.yml \
            --profile test \
            up -d data-service mcp-gateway api admin-dashboard web
        env:
          ADMIN_TOKEN: "ci-secret-token"
          VIEWER_TOKEN: "ci-viewer-token"
          CORS_ALLOW_ORIGINS: "http://localhost:8080"
      - name: Run e2e tests (container, profile=test)
        run: |
          # e2e is the only terminal process. Its exit code is the job result;
          # Compose honours the declared service_healthy dependency graph without
          # attaching to the completed ci-state-init container.
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.ci.yml \
            --profile test \
            run --rm e2e
        env:
          ADMIN_TOKEN: "ci-secret-token"
          VIEWER_TOKEN: "ci-viewer-token"
          CORS_ALLOW_ORIGINS: "http://localhost:8080"
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml --profile test logs api
          echo '--- data-service logs ---'
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml --profile test logs data-service
      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml --profile test down -v
