name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-python:
    name: Python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install uv + deps
        run: |
          pip install uv
          uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check api-service/src/
      - name: Ruff format check
        run: uv run ruff format --check api-service/src/
      - name: Pyright type check
        run: |
          npm install -g pyright
          pyright
      - name: uv audit — dependency vulnerability scan
        # Warn, don't fail: 3 vulns are unfixable (chromadb code injection, torch
        # memory corruption — no upstream patch available). All fixable vulns
        # have been upgraded. Check `make ci-audit` locally for details.
        run: uv audit --preview-features audit-command || true

  lint-js:
    name: JS lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Biome lint
        run: npx @biomejs/biome check --max-diagnostics=500

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install uv + deps
        run: |
          pip install uv
          uv sync --frozen
      - name: Run API tests
        run: uv run pytest api-service/src/api_service/tests/ -v --tb=short
        env:
          OLLAMA_URL: "http://localhost:11434"
          OLLAMA_MODEL: "qwen2.5:0.5b"
          PYTHONPATH: ${{ github.workspace }}
      - name: Run demo web tests
        run: uv run pytest demo/web/tests/ demo/tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run SDK tests
        run: uv run pytest helperium-sdk/tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run RAG unit tests
        run: uv run pytest rag/tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run RAG search quality benchmark (CI mode — mock embeddings)
        run: uv run pytest rag/tests/benchmark/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [data-service, mcp-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: govulncheck — Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: ${{ matrix.dir }}
      - name: golangci-lint (install v2 from source)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        working-directory: ${{ matrix.dir }}
      - name: Run golangci-lint
        run: golangci-lint run ./...
        working-directory: ${{ matrix.dir }}

  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [data-service, mcp-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Test
        # NOTE: grep removed from pipeline — go test -json exits 0 on success and
        #       1 on failure, which is the correct signal. The old | grep -E ...
        #       caused a false-positive CI failure when all tests passed (grep
        #       exits 1 on no match, and GHA's pipefail propagates that).
        #       Full JSON log saved via tee for inspection.
        run: go test ./... -count=1 -timeout 180s -json 2>&1 | tee /tmp/gotest-json.log
        working-directory: ${{ matrix.dir }}

  test-e2e:
    name: E2E tests (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Docker layer cache (type=gha) ──────────────────────────────
      # Общий слой кэшируется в GH Actions cache между runs → повторные
      # сборки образов занимают минуты вместо десятков.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build data-service (cache Docker layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: data-service/Dockerfile
          tags: helperium-data:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mcp-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-gateway/Dockerfile
          tags: helperium-mcp-gateway:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-service/Dockerfile
          tags: helperium-api:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-dashboard/Dockerfile
          tags: helperium-admin:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/web/Dockerfile
          tags: helperium-web:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create data directories for bind mounts
        run: |
          mkdir -p .data/app .data/rag .data/hf_cache .data/uploads .data/pg .data/tenants
          sudo chown -R 1000:1000 .data
      - name: Run e2e tests (container, profile=test)
        run: docker compose --profile test up e2e --abort-on-container-exit --exit-code-from e2e
        env:
          ADMIN_TOKEN: "ci-secret-token"
          VIEWER_TOKEN: "ci-viewer-token"
      - name: Dump API logs on failure
        if: failure()
        run: docker compose --profile test logs api
      - name: Stop services
        if: always()
        run: docker compose --profile test down -v
